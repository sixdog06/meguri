services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: meguri
      POSTGRES_PASSWORD: meguri
      POSTGRES_DB: meguri
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meguri"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .            # 仓库根：镜像需要 data/（作品映射 + 离线数据包）
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env.local    # LLM key（MEGURI_OPENAI_*），勿写进本文件
        required: false     # 新克隆未配 key 也能起栈（缺 key 时 LLM 调用才报错）
    environment:
      MEGURI_DATABASE_URL: postgresql+psycopg://meguri:meguri@db:5432/meguri
      # 圣地数据源保持 live（部署环境网络正常）；本机开发被 Cloudflare 封时
      # 用 dev.sh 的 file 模式（离线数据包）。LLM/交通/语料无模式开关（唯一实现）
      MEGURI_SEICHI_MODE: live
      MEGURI_OTP_BASE_URL: http://otp:8080/otp
    depends_on:
      db:
        condition: service_healthy
      otp:
        condition: service_started

  # OTP（ADR-0003）：graph 由 otp/download.sh + otp/build.sh 构建（幂等）。
  # data/ 里至少要有裁剪好的 OSM pbf 才能启动（--load 需要 graph.obj）。
  otp:
    image: opentripplanner/opentripplanner:2.6.0
    command: --load --serve
    volumes:
      - ./otp/data:/var/opentripplanner
    ports:
      - "8081:8080"
    mem_limit: 4g

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
